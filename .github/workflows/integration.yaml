name: Integration Tests

on:
  workflow_dispatch:

concurrency:
  group: toggl-integration-tests
  cancel-in-progress: false

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run non-premium integration tests
        env:
          TOGGL_API_TOKEN: ${{ secrets.TOGGL_API_TOKEN }}
          TOGGL_DEFAULT_WORKSPACE_ID: ${{ vars.TOGGL_TEST_WORKSPACE_ID }}
        run: uv run pytest -m "integration and not premium" --no-cov
